name: workconnect
description: "WorkConnect - Collaborative Job Assignment & Tracking Platform"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  socket_io_client: ^2.0.3+1

  # State management
  provider: ^6.1.2

  # Networking (for Node/Express backend later)
  http: ^1.2.1

  # Local token storage
  shared_preferences: ^2.2.3

  # Push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/